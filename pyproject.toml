[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-summary-notify"
version = "0.1.0"
description = "Automatically detect new YouTube videos, summarize with Gemini AI, and notify via webhooks"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pyyaml",
    "httpx",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "moto[s3,dynamodb,secretsmanager]",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
